name: Update ItsDrDan videos and transcripts

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "videos.json"
      - "captions/**"
      - "scripts/build_videos.py"
      - ".github/workflows/update-library.yml"

  workflow_dispatch:
    inputs:
      caption_limit:
        description: "Maximum missing captions to try this run (0 = all)"
        required: false
        default: "20"

  schedule:
    - cron: "23 11 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: itsdrdan-video-finder-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CAPTION_LIMIT: ${{ github.event.inputs.caption_limit || '20' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Update video library and missing transcripts
        run: python scripts/build_videos.py

      - name: Save updated library and VTT files
        run: |
          if git diff --quiet -- videos.json captions/; then
            echo "No library or transcript changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json captions/
            git commit -m "Update ItsDrDan videos and transcripts"
            git push
          fi

      - name: Prepare website for GitHub Pages
        run: |
          rm -rf _site
          mkdir -p _site/captions

          cp index.html _site/index.html
          cp videos.json _site/videos.json

          if [ -d captions ]; then
            find captions -maxdepth 1 -type f -name '*.vtt' -exec cp {} _site/captions/ \;
          fi

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
